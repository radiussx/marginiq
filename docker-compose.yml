services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: marginiq
      POSTGRES_USER: marginiq
      POSTGRES_PASSWORD: marginiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/marginiq
      SPRING_DATASOURCE_USERNAME: marginiq
      SPRING_DATASOURCE_PASSWORD: marginiq
      SPRING_DATA_REDIS_HOST: redis
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
